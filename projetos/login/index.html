<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=mail" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=key" />
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem"></div>

            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo de volta. Faça login para acessar sua conta!</p>

                <form action="login.php" method="post">
                    <div class="campo">  
                        <span class="material-symbols-outlined">mail</span>                  
                        <input type="email" name="login" id="ilogin" placeholder="Seu email" autocomplete="email" maxlength="30" required>
                        <label for="ilogin">Login</label>
                    </div>

                    <div class="campo">
                        <span class="material-symbols-outlined">key</span>
                        <input type="password" name="Senha" id="isenha" autocomplete="current-password" required minlength="8">
                        <label for="isenha">Senha</label>                        
                    </div>
                    <input type="submit" value="Enviar">
                    <a href="esqueci.html" class="botao">Esqueci minha senha</a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
