<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isexo" value="m"><label for="isexo">Masculino</label><br>

            <input type="radio" name="sexo" id="isexof" value="f" checked><label for="isexof">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="bas" id="ibas"><label for="ibas">Basquete</label><br>

            <input type="checkbox" name="fut" id="ifut" checked><label for="ifut">Futebol</label><br>


            <input type="checkbox" name="nat" id="inat"><label for="inat">Natação</label> <br>


            <input type="checkbox" name="ten" id="iten"><label for="iten">Tênis</label><br>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
