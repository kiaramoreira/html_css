<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        .container{
            background-color: lightcoral;
            display: flex;
            flex-flow: row wrap-reverse;
        }
        .item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo de quebrass A</div>
        <div class="item">Exemplo de quebrass B</div>
        <div class="item">Exemplo de quebrass C</div>
        <div class="item">Exemplo de quebrass D</div>
        <div class="item">Exemplo de quebrass E</div>
        <div class="item">Exemplo de quebrass F</div>
        <div class="item">Exemplo de quebrass G</div>
    </div>
</body>
</html>
