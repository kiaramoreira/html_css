    <title>Iframes</title>
    <style>
        iframe{
            width: 400px;
            height: 400px;
            border: 3px dashed darkblue;
        }

</head>
<body>
    <p>
        Acessando o site do

    <p>
        Acessando o repositorio do
        <iframe src="https://gustavoguanabara.github.io" frameborder="0"></iframe>

    </p>
</body>
</html>
